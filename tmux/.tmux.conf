set -g base-index 0

unbind C-b
set -g prefix C-a
bind-key C-a send-prefix

bind-key R source-file ~/.tmux.conf 
set -g mouse on
set-option -sg escape-time 0

# true color (24-bit) support
set-option -g default-terminal "tmux-256color"
set-option -ga terminal-overrides ",xterm-256color:Tc"
set-option -ga terminal-overrides ",tmux-256color:Tc"
# undercurl support
set-option -ga terminal-overrides ',*:Smulx=\E[4::%p1%dm'
set-option -ga terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'

# focus events for neovim autoread
set-option -g focus-events on
set -g history-limit 10000
setw -g mode-keys vi

bind-key : command-prompt
bind-key r refresh-client
bind-key L clear-history
bind-key C-l send-keys 'C-l'
bind-key space next-window
bind-key bspace previous-window
bind-key enter next-layout

bind-key v split-window -h
bind-key s split-window -v

# vim-tmux-navigator: C-h/j/k/l 로 nvim 과 tmux 패널 통합 이동
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|l?n?vim?x?|fzf)(diff)?$'"
bind-key -n 'C-h' if-shell "$is_vim" 'send-keys C-h' 'select-pane -L'
bind-key -n 'C-j' if-shell "$is_vim" 'send-keys C-j' 'select-pane -D'
bind-key -n 'C-k' if-shell "$is_vim" 'send-keys C-k' 'select-pane -U'
bind-key -n 'C-l' if-shell "$is_vim" 'send-keys C-l' 'if-shell "[ $(tmux display-message -p \"#{pane_at_right}\") -eq 1 ]" "send-keys C-l" "select-pane -R"'
bind-key -n 'C-\' if-shell "$is_vim" 'send-keys C-\\'  'select-pane -l'
bind-key -T copy-mode-vi 'C-h' select-pane -L
bind-key -T copy-mode-vi 'C-j' select-pane -D
bind-key -T copy-mode-vi 'C-k' select-pane -U
bind-key -T copy-mode-vi 'C-l' select-pane -R
bind-key -T copy-mode-vi 'C-\' select-pane -l

bind-key M-Left select-pane -L
bind-key M-Right select-pane -R
bind-key M-Up select-pane -U
bind-key M-Down select-pane -D
bind-key C-o rotate-window
bind-key + select-layout main-horizontal
bind-key = select-layout main-vertical
bind-key a last-pane
bind-key q display-panes
bind-key c new-window
bind-key t next-window
bind-key T previous-window
bind-key [ copy-mode
bind-key ] paste-buffer

# set-option -g status-interval 1
set -g status-position bottom
set -g status-justify left
set -g status-style 'fg=red'
set -g status-bg black
set -g status-fg white
set -g status-interval 60
set -g status-left-length 30
set -g status-left '#[fg=green] #[fg=red]'
set -g status-right '%a %l:%M:%S %p#[default] #[fg=skyblue]%Y-%m-%d'

set -g pane-border-style 'fg=skyblue'
set -g pane-active-border-style 'fg=green'

set -g window-status-current-style 'fg=black bg=skyblue'
setw -g window-status-current-format ' #I #W #F '
setw -g window-status-style 'fg=white bg=black'
setw -g window-status-format ' #I #[fg=white]#W #[fg=yellow]#F '

set -g message-style 'fg=yellow bg=red bold'

#don't do anything when a 'bell' rings
set -g visual-activity off
set -g visual-bell off
set -g visual-silence off
setw -g monitor-activity off
set -g bell-action none

# clock mode
setw -g clock-mode-colour yellow

# copy mode
setw -g mode-style 'fg=black bg=red bold'
